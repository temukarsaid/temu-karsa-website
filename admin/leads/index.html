<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads KarsaBiz — Admin</title>
<link rel="icon" type="image/png" href="/assets/img/favicon-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shell.css">
<style>
  /* Tabel, chip status, panel, skeleton, dan state kosong diambil dari
     shell.css — di sini cuma sisa yang khusus halaman ini: overlay detail
     dan lembar cetak PDF-nya. */
  :root { --sh-md: 0 14px 40px rgba(8,21,47,.08); }

  .wrap { margin: 0; padding: 0; }
  .panel td { vertical-align: top; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
    border-radius: 999px; border: 0; background: var(--blue); color: #fff;
    font-family: var(--font); font-weight: 700; font-size: .88rem; cursor: pointer; text-decoration: none;
  }
  .btn--ghost { background: var(--canvas-alt); color: var(--ink); }

  /* ---------------------------------------------------------- Detail/print overlay */
  #detailOverlay { display: none; position: fixed; inset: 0; background: var(--canvas); z-index: 20; overflow-y: auto; }
  #detailOverlay.is-open { display: block; }
  .detail-bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--line);
  }

  .sheet { width: 100%; max-width: 780px; margin: 28px auto 60px; background: var(--surface); box-shadow: var(--sh-md); border-radius: 4px; padding: 52px 56px 44px; }
  .letterhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 24px; }
  .letterhead__brand { display: flex; gap: 12px; }
  .letterhead__brand img { height: 40px; width: auto; object-fit: contain; }
  .letterhead__brand-name { font-size: 1rem; font-weight: 800; color: var(--navy); }
  .letterhead__addr { margin: 6px 0 0; font-size: .76rem; line-height: 1.6; color: var(--muted); max-width: 30ch; }
  .letterhead__meta { text-align: right; }
  .letterhead__doctitle { margin: 0 0 8px; font-size: 1.2rem; font-weight: 800; }
  .letterhead__row { font-size: .76rem; color: var(--body-c); }

  .rule { height: 3px; background: var(--blue); border-radius: 2px; }

  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--line); }
  .meta-label { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .meta-name { margin: 0 0 3px; font-weight: 700; }
  .meta-line { margin: 0; font-size: .84rem; color: var(--body-c); line-height: 1.6; }
  .profile-item { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; padding: 3px 0; }
  .profile-item dt { color: var(--muted); margin: 0; }
  .profile-item dd { margin: 0; font-weight: 600; }

  .section-label { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 14px; }
  .section-label h2 { margin: 0; font-size: .9rem; font-weight: 800; }
  .section-label span { font-size: .74rem; color: var(--muted); }

  .rec { display: grid; grid-template-columns: 4px 1fr auto; gap: 16px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .rec:last-child { border-bottom: 0; }
  .rec__stripe { border-radius: 2px; }
  .rec--wajib .rec__stripe { background: var(--mint); }
  .rec--kondisional .rec__stripe { background: var(--gold); }
  .rec--disarankan .rec__stripe { background: var(--blue); }
  .rec__title { margin: 0 0 4px; font-size: .92rem; font-weight: 700; }
  .rec__desc { margin: 0; font-size: .8rem; color: var(--body-c); line-height: 1.6; }
  .rec__status { align-self: start; white-space: nowrap; padding: 4px 11px; border-radius: 999px; font-size: .7rem; font-weight: 700; }
  .rec--wajib .rec__status { background: var(--mint-soft); color: #026248; }
  .rec--kondisional .rec__status { background: var(--gold-soft); color: var(--gold); }
  .rec--disarankan .rec__status { background: var(--blue-soft); color: var(--blue); }

  .kbli-row { display: flex; gap: 14px; align-items: baseline; padding: 6px 0; font-size: .8rem; }
  .kbli-code { font-weight: 700; color: var(--navy); background: var(--canvas-alt); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .kbli-title { color: var(--body-c); }

  .disclaimer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .72rem; line-height: 1.6; color: var(--muted); }

  .pagination {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 16px 4px 4px; border-top: 1px solid var(--line);
  }
  .pagination__info { font-size: .82rem; color: var(--muted); }
  .pagination__nav { display: flex; align-items: center; gap: 4px; }
  .pagination__btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; border: 0;
    background: transparent; color: var(--ink); font-family: var(--font);
    font-size: .84rem; font-weight: 600; cursor: pointer;
  }
  .pagination__btn:hover { background: var(--canvas-alt); }
  .pagination__btn.is-active { background: var(--blue); color: #fff; }
  .pagination__btn:disabled { color: var(--line); cursor: default; }
  .pagination__btn:disabled:hover { background: transparent; }
  .pagination__ellipsis { padding: 0 4px; color: var(--muted); font-size: .84rem; }

  @media print {
    .shell__sidebar, .shell__topbar, .shell__burger, .shell__scrim,
    .detail-bar, .wrap, .page-header, .pagination { display: none !important; }
    #detailOverlay { position: static; }
    .sheet { box-shadow: none; margin: 0; max-width: none; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<script>
  fetch('/api/admin-me').then(function (r) {
    if (!r.ok) window.location.href = '/admin/';
  }).catch(function () { window.location.href = '/admin/'; });
</script>

<div class="shell">
  <div class="shell__topbar">
    <img class="shell__topbar-logo" src="/assets/img/logo-temu-karsa.png" alt="Temu Karsa">
  </div>
  <aside class="shell__sidebar">
    <div class="shell__brand">
      <img src="/assets/img/logo-temu-karsa.png" alt="Temu Karsa">
    </div>
    <nav class="shell__nav">
      <div class="shell__group-label">Main</div>
      <a class="shell__link" href="/admin/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <div class="shell__group-label">Konten</div>
      <a class="shell__link" href="/admin/articles/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Artikel
      </a>
      <div class="shell__group-label">KarsaBiz</div>
      <a class="shell__link is-active" href="/admin/leads/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Leads
      </a>
    </nav>
    <div class="shell__sidebar-foot">
      <a class="shell__logout" href="/api/admin-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Keluar
      </a>
    </div>
  </aside>

  <div class="shell__body">
    <div class="shell__main">
      <div class="page-header">
        <div>
          <h1 class="page-header__title">Leads KarsaBiz</h1>
          <p class="page-header__sub">Semua yang submit kuis diagnostic legalitas — klik satu baris buat lihat detail &amp; download PDF</p>
        </div>
        <input type="search" id="leadsSearch" class="panel__search" placeholder="Cari nama atau email...">
      </div>
      <div class="wrap" id="listView">
        <section class="panel">
          <div class="table-scroll">
            <table id="leadsTable" class="cards-mobile" hidden>
              <colgroup>
                <col style="width:18%"><col style="width:24%"><col style="width:19%"><col style="width:15%"><col style="width:24%"><col style="width:48px">
              </colgroup>
              <thead>
                <tr><th>Nama</th><th>Email</th><th>No. WhatsApp</th><th>Tanggal</th><th style="text-align:center">Status</th><th></th></tr>
              </thead>
              <tbody id="leadsBody"></tbody>
            </table>
          </div>
          <div class="skeleton" id="stateMsg">
            <div class="skeleton__row"></div><div class="skeleton__row"></div><div class="skeleton__row"></div>
          </div>
          <div class="pagination" id="pagination" hidden>
            <span class="pagination__info" id="paginationInfo"></span>
            <div class="pagination__nav" id="paginationNav"></div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>

<div id="detailOverlay">
  <div class="detail-bar">
    <button class="btn btn--ghost" id="btnBack">&larr; Kembali ke daftar</button>
    <button class="btn" id="btnPrint">Download PDF</button>
  </div>
  <div class="sheet" id="sheetContent"></div>
</div>

<script src="../shell.js"></script>
<script>
  var STATUS_LABEL = { wajib: 'Perlu dimiliki', kondisional: 'Perlu diperiksa', disarankan: 'Disarankan' };
  var ANSWER_LABELS = {
    perorangan: 'Usaha Perorangan / UMKM Mandiri', cv: 'CV', pt: 'PT Perorangan / Umum', yayasan: 'Yayasan / Koperasi',
    makanan: 'Makanan & Minuman Olahan', dagang: 'Perdagangan Barang Umum', jasa: 'Jasa / Layanan Profesional',
    manufaktur: 'Manufaktur / Produksi Pabrikan', akomodasi: 'Akomodasi & Pariwisata',
    rumahan: 'Skala rumahan', industri: 'Skala industri/pabrik',
    daging: 'Mengandung daging', susu: 'Mengandung susu', kering: 'Kering / non-daging', alkohol: 'Beralkohol/pengawet',
    kosmetik: 'Kosmetik', obat: 'Obat/Suplemen', fashion: 'Fashion',
    konsultasi: 'Konsultasi Bisnis & Manajemen', kreatif: 'Agensi Kreatif/Desain', it: 'IT/Software',
    laundry: 'Laundry', kecantikan: 'Kecantikan/Salon', tekstil: 'Tekstil/Garmen', furnitur: 'Furnitur', plastik: 'Plastik',
    logam: 'Logam', elektronik: 'Elektronik', lainnya: 'Lainnya',
    rumah: 'Dapur rumah (SOHO)', komersial: 'Tempat komersial', pabrik: 'Pabrik/Gudang', digital: 'Digital murni',
    lokal: 'Lokal', nasional: 'Seluruh Indonesia', 'ekspor-impor': 'Ekspor/Impor',
    berdampak: 'Ya, ada dampak lingkungan', 'tidak-berdampak': 'Tidak ada dampak lingkungan'
  };
  function labelFor(v) {
    if (Array.isArray(v)) return v.map(labelFor).join(', ') || '—';
    if (v == null) return '—';
    return ANSWER_LABELS[v] || v;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var DOTS_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

  function actionsCell(items) {
    var buttons = items.map(function (it) {
      return '<button type="button" class="' + (it.danger ? 'is-danger' : '') + '" data-action="' + esc(it.action) + '" data-arg="' + esc(it.arg) + '">' + it.icon + esc(it.label) + '</button>';
    }).join('');
    return (
      '<td class="col-actions">' +
        '<div class="row-actions">' +
          '<button type="button" class="row-actions__btn" data-menu-toggle aria-label="Aksi baris">' + DOTS_ICON + '</button>' +
          '<div class="row-actions__menu">' + buttons + '</div>' +
        '</div>' +
      '</td>'
    );
  }

  document.addEventListener('click', function (e) {
    var toggle = e.target.closest('[data-menu-toggle]');
    var openMenu = document.querySelector('.row-actions.is-open');
    if (toggle) {
      e.stopPropagation();
      var wrap = toggle.closest('.row-actions');
      var wasOpen = wrap.classList.contains('is-open');
      if (openMenu) openMenu.classList.remove('is-open');
      if (!wasOpen) wrap.classList.add('is-open');
      return;
    }
    var actionBtn = e.target.closest('.row-actions__menu button[data-action]');
    if (actionBtn) {
      e.stopPropagation();
      if (openMenu) openMenu.classList.remove('is-open');
      runRowAction(actionBtn.dataset.action, actionBtn.dataset.arg);
      return;
    }
    if (openMenu && !e.target.closest('.row-actions__menu')) openMenu.classList.remove('is-open');
  });

  function runRowAction(action, arg) {
    if (action === 'view-pdf') {
      openDetail(arg);
    } else if (action === 'whatsapp') {
      window.open('https://wa.me/' + String(arg).replace(/\D/g, '').replace(/^0/, '62'), '_blank');
    } else if (action === 'mailto') {
      window.location.href = 'mailto:' + arg;
    } else if (action === 'delete') {
      if (!window.confirm('Hapus lead ini? Aksi ini gak bisa dibatalkan.')) return;
      fetch('/api/leads?id=' + encodeURIComponent(arg), { method: 'DELETE' })
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .then(function (res) { if (!res.ok) throw new Error(res.data.error || 'Gagal menghapus'); loadList(); })
        .catch(function (err) { window.alert(err.message); });
    }
  }

  var leadsBody = document.getElementById('leadsBody');
  var leadsTable = document.getElementById('leadsTable');
  var stateMsg = document.getElementById('stateMsg');
  var listView = document.getElementById('listView');
  var detailOverlay = document.getElementById('detailOverlay');
  var sheetContent = document.getElementById('sheetContent');

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function showState(kind, title, hint) {
    stateMsg.hidden = false;
    stateMsg.className = 'empty-state' + (kind === 'error' ? ' empty-state--error' : '');
    stateMsg.innerHTML = '<p class="empty-state__title">' + esc(title) + '</p><p class="empty-state__hint">' + esc(hint) + '</p>';
  }

  var allLeads = [];
  var currentList = [];
  var currentPage = 1;
  var PAGE_SIZE = 10; // sama kayak daftar Artikel — muat ~7-9 baris 1 layar
                       // tanpa scroll di laptop biasa, 10 angka bulat.
  var pagination = document.getElementById('pagination');
  var paginationInfo = document.getElementById('paginationInfo');
  var paginationNav = document.getElementById('paginationNav');

  function renderLeadsRows(rows, resetPage) {
    currentList = rows;
    if (resetPage) currentPage = 1;

    if (!rows.length) {
      leadsTable.hidden = true;
      pagination.hidden = true;
      var msg = allLeads.length ? 'Tidak ada lead yang cocok' : 'Belum ada lead masuk';
      var hint = allLeads.length ? 'Coba kata kunci lain, atau kosongkan kolom pencarian.' : 'Lead muncul di sini otomatis begitu ada yang menyelesaikan kuis KarsaBiz di website.';
      showState('empty', msg, hint);
      return;
    }
    stateMsg.hidden = true;
    leadsTable.hidden = false;

    var totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PAGE_SIZE;
    var pageItems = rows.slice(start, start + PAGE_SIZE);

    leadsBody.innerHTML = pageItems.map(function (row) {
      var statusClass = row.status === 'pdf_siap' ? 'status-pdf_siap' : 'status-baru';
      var statusText = row.status === 'pdf_siap' ? 'Sudah dikirim' : 'Belum diproses';
      return (
        '<tr class="is-clickable" data-id="' + esc(row.id) + '">' +
          '<td class="cell-name cell-card-title">' + esc(row.nama) + '</td>' +
          '<td class="cell-muted" data-label="Email">' + esc(row.email) + '</td>' +
          '<td class="cell-muted cell-num" data-label="No. WhatsApp">' + esc(row.whatsapp) + '</td>' +
          '<td class="cell-muted" data-label="Tanggal">' + fmtDate(row.created_at) + '</td>' +
          '<td style="text-align:center" data-label="Status"><span class="status-chip ' + statusClass + '">' + esc(statusText) + '</span></td>' +
          actionsCell([
            { action: 'view-pdf', arg: row.id, label: 'Lihat & download PDF', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>' },
            { action: 'whatsapp', arg: row.whatsapp, label: 'Kirim via WhatsApp', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-4.95A9 9 0 1 1 8 19.5z"/></svg>' },
            { action: 'mailto', arg: row.email, label: 'Kirim via Email', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>' },
            { action: 'delete', arg: row.id, label: 'Hapus lead', icon: ICON_TRASH, danger: true },
          ]) +
        '</tr>'
      );
    }).join('');
    Array.prototype.forEach.call(leadsBody.querySelectorAll('tr'), function (tr) {
      tr.addEventListener('click', function (e) {
        if (e.target.closest('.row-actions')) return;
        openDetail(tr.dataset.id);
      });
    });

    renderPagination(totalPages, rows.length, start, pageItems.length);
  }

  function renderPagination(totalPages, totalItems, start, shownCount) {
    if (totalPages <= 1) { pagination.hidden = true; return; }
    pagination.hidden = false;
    paginationInfo.textContent = 'Menampilkan ' + (start + 1) + '-' + (start + shownCount) + ' dari ' + totalItems + ' lead';

    var btns = [];
    btns.push('<button type="button" class="pagination__btn" data-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? ' disabled' : '') + ' aria-label="Halaman sebelumnya">&lsaquo;</button>');

    var pages = [];
    for (var p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) pages.push(p);
      else if (pages[pages.length - 1] !== '…') pages.push('…');
    }
    pages.forEach(function (p) {
      if (p === '…') { btns.push('<span class="pagination__ellipsis">…</span>'); return; }
      btns.push('<button type="button" class="pagination__btn' + (p === currentPage ? ' is-active' : '') + '" data-page="' + p + '">' + p + '</button>');
    });

    btns.push('<button type="button" class="pagination__btn" data-page="' + (currentPage + 1) + '"' + (currentPage === totalPages ? ' disabled' : '') + ' aria-label="Halaman berikutnya">&rsaquo;</button>');
    paginationNav.innerHTML = btns.join('');
  }
  paginationNav.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-page]');
    if (!btn || btn.disabled) return;
    currentPage = Number(btn.dataset.page);
    renderLeadsRows(currentList);
    document.querySelector('.panel').scrollIntoView({ block: 'start', behavior: 'smooth' });
  });

  document.getElementById('leadsSearch').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    var filtered = !q ? allLeads : allLeads.filter(function (l) {
      return (l.nama || '').toLowerCase().indexOf(q) !== -1 || (l.email || '').toLowerCase().indexOf(q) !== -1;
    });
    renderLeadsRows(filtered, true);
  });

  function loadList() {
    fetch('/api/leads').then(function (res) {
      if (res.status === 401) {
        window.location.href = '/admin/';
        return null;
      }
      return res.json();
    }).then(function (data) {
      if (!data) return;
      if (data.error) { showState('error', 'Data lead gagal dimuat', data.error); return; }
      allLeads = data;
      renderLeadsRows(allLeads);
    }).catch(function (err) { showState('error', 'Data lead gagal dimuat', String(err)); });
  }

  function renderRecommendations(items) {
    if (!items || !items.length) return '';
    return (
      '<div class="section-label"><h2>Rekomendasi Legalitas</h2><span>' + items.length + ' item ditemukan</span></div>' +
      items.map(function (item) {
        return (
          '<div class="rec rec--' + esc(item.status) + '">' +
            '<div class="rec__stripe"></div>' +
            '<div><p class="rec__title">' + esc(item.label) + '</p><p class="rec__desc">' + esc(item.description) + '</p></div>' +
            '<span class="rec__status">' + esc(item.statusLabel || STATUS_LABEL[item.status] || '') + '</span>' +
          '</div>'
        );
      }).join('')
    );
  }

  function renderKbli(rows) {
    if (!rows || !rows.length) return '';
    return (
      '<div class="section-label"><h2>Referensi KBLI 2025</h2><span>BPS, Katalog 1302017</span></div>' +
      rows.map(function (r) {
        return '<div class="kbli-row"><span class="kbli-code">' + esc(r.code) + '</span><span class="kbli-title">' + esc(r.title) + '</span></div>';
      }).join('')
    );
  }

  function renderProfile(answers) {
    answers = answers || {};
    var rows = [['Bentuk usaha', labelFor(answers.q1)], ['Kategori', labelFor(answers.q2)]];
    if (answers.q2 === 'makanan') {
      rows.push(['Kemasan', labelFor(answers.kemasan)]);
      rows.push(['Bahan utama', labelFor(answers.bahan)]);
    } else if (answers.q2 === 'dagang') {
      rows.push(['Produk khusus', labelFor(answers.produkKhusus)]);
    } else if (answers.q2 === 'jasa') {
      rows.push(['Jenis jasa', labelFor(answers['q3-jasa'])]);
    } else if (answers.q2 === 'manufaktur') {
      rows.push(['Produk', labelFor(answers['q3-manufaktur'])]);
    }
    rows.push(['Lokasi produksi', labelFor(answers.q5)]);
    rows.push(['Distribusi', labelFor(answers.q6)]);
    rows.push(['Dampak lingkungan', labelFor(answers.q7)]);
    return rows.map(function (r) {
      return '<div class="profile-item"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>';
    }).join('');
  }

  function openDetail(id) {
    sheetContent.innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px 0">Memuat...</p>';
    detailOverlay.classList.add('is-open');
    fetch('/api/leads?id=' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (lead) {
      if (lead.error) { sheetContent.innerHTML = '<p>Gagal memuat: ' + esc(lead.error) + '</p>'; return; }
      var ref = 'KB-' + new Date(lead.created_at).getFullYear() + '-' + lead.id.slice(0, 6).toUpperCase();
      sheetContent.innerHTML =
        '<div class="letterhead">' +
          '<div class="letterhead__brand">' +
            '<img src="/assets/img/logo-temu-karsa.png" alt="Temu Karsa">' +
            '<div>' +
              '<div class="letterhead__brand-name">Temu Karsa</div>' +
              '<p class="letterhead__addr">Ruko Taman Juanda, Jl. Pahlawan Blok B1 No.3,<br>Bekasi Timur, Jawa Barat 17111<br>temukarsaid@gmail.com &middot; +62 851-2155-8129</p>' +
            '</div>' +
          '</div>' +
          '<div class="letterhead__meta">' +
            '<h1 class="letterhead__doctitle">Hasil Diagnostic<br>Legalitas Bisnis</h1>' +
            '<p class="letterhead__row">No. Referensi: ' + esc(ref) + '</p>' +
            '<p class="letterhead__row">Tanggal: ' + fmtDate(lead.created_at) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="rule"></div>' +
        '<div class="meta-grid">' +
          '<div>' +
            '<p class="meta-label">Untuk</p>' +
            '<p class="meta-name">' + esc(lead.nama) + '</p>' +
            '<p class="meta-line">' + esc(lead.whatsapp) + '</p>' +
            '<p class="meta-line">' + esc(lead.email) + '</p>' +
          '</div>' +
          '<div>' +
            '<p class="meta-label">Ringkasan Profil Bisnis</p>' +
            renderProfile(lead.answers) +
          '</div>' +
        '</div>' +
        renderRecommendations(lead.recommendations) +
        renderKbli(lead.kbli_matched) +
        '<p class="disclaimer"><strong>Catatan:</strong> Dokumen ini adalah identifikasi awal berdasarkan informasi yang diberikan lewat KarsaBiz, bukan konsultasi hukum definitif.</p>';
    }).catch(function (err) { sheetContent.innerHTML = '<p>Gagal memuat: ' + err + '</p>'; });
  }

  document.getElementById('btnBack').addEventListener('click', function () {
    detailOverlay.classList.remove('is-open');
  });
  document.getElementById('btnPrint').addEventListener('click', function () { window.print(); });

  loadList();

  var linkedId = new URLSearchParams(window.location.search).get('id');
  if (linkedId) openDetail(linkedId);
</script>
</body>
</html>
