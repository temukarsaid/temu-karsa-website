<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Dokumen Usaha — Admin</title>
<link rel="icon" type="image/png" href="/assets/img/favicon-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shell.css">
<style>
  /* Sama persis admin/leads/index.html — tabel, chip status, panel,
     skeleton, state kosong dari shell.css; sisanya overlay detail/cetak. */
  :root { --sh-md: 0 14px 40px rgba(8,21,47,.08); }

  .wrap { margin: 0; padding: 0; }
  .panel td { vertical-align: top; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
    border-radius: 999px; border: 0; background: var(--blue); color: #fff;
    font-family: var(--font); font-weight: 700; font-size: .88rem; cursor: pointer; text-decoration: none;
  }
  .btn--ghost { background: var(--canvas-alt); color: var(--ink); }

  #detailOverlay { display: none; position: fixed; inset: 0; background: var(--canvas); z-index: 20; overflow-y: auto; }
  #detailOverlay.is-open { display: block; }
  .detail-bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--line);
  }

  .sheet { width: 100%; max-width: 780px; margin: 28px auto 60px; background: var(--surface); box-shadow: var(--sh-md); border-radius: 4px; padding: 52px 56px 44px; }
  .letterhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 24px; }
  .letterhead__brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .letterhead__brand img { height: 40px; width: auto; object-fit: contain; }
  .letterhead__brand-name { font-size: 1rem; font-weight: 800; color: var(--navy); }
  .letterhead__addr { margin: 2px 0 0; font-size: .76rem; line-height: 1.6; color: var(--muted); max-width: 35ch; }
  .letterhead__meta { text-align: right; }
  .letterhead__doctitle { margin: 0 0 8px; font-size: 1.2rem; font-weight: 800; }
  .letterhead__row { font-size: .76rem; color: var(--body-c); }

  .rule { height: 3px; background: var(--blue); border-radius: 2px; }

  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--line); }
  .meta-label { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .profile-item { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; padding: 3px 0; }
  .profile-item dt { color: var(--muted); margin: 0; }
  .profile-item dd { margin: 0; font-weight: 600; }
  /* Nilai tunggal tanpa pasangan dt (Jenis Layanan, Alamat Kedudukan Usaha)
     — bukan <dd>, biar gak kena margin-inline-start:40px bawaan browser
     yang bikin keliatan ketengah/geser dari judulnya di atas. */
  .meta-value { margin: 0; font-weight: 700; }
  .body-text { margin: 0; font-size: .9rem; line-height: 1.6; color: var(--body-c); }

  .section-label { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 14px; }
  .section-label h2 { margin: 0; font-size: .9rem; font-weight: 800; }
  .section-label span { font-size: .74rem; color: var(--muted); }

  /* Satu blok per pendiri/NPWP/pilihan nama — reuse pola .rec dari leads
     tapi tanpa stripe warna status (gak ada status wajib/kondisional di
     sini), cukup kartu abu-abu tipis dipisah garis. */
  .entry { padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry__title { margin: 0 0 6px; font-size: .88rem; font-weight: 700; }

  .disclaimer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .72rem; line-height: 1.6; color: var(--muted); }

  .pagination {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 16px 4px 4px; border-top: 1px solid var(--line);
  }
  .pagination__info { font-size: .82rem; color: var(--muted); }
  .pagination__nav { display: flex; align-items: center; gap: 4px; }
  .pagination__btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; border: 0;
    background: transparent; color: var(--ink); font-family: var(--font);
    font-size: .84rem; font-weight: 600; cursor: pointer;
  }
  .pagination__btn:hover { background: var(--canvas-alt); }
  .pagination__btn.is-active { background: var(--blue); color: #fff; }
  .pagination__btn:disabled { color: var(--line); cursor: default; }
  .pagination__btn:disabled:hover { background: transparent; }
  .pagination__ellipsis { padding: 0 4px; color: var(--muted); font-size: .84rem; }

  @media print {
    @page { size: A4 portrait; margin: 12mm 15mm; }
    html, body {
      background: #fff !important; color: #000 !important;
      margin: 0 !important; padding: 0 !important; height: auto !important; overflow: visible !important;
    }
    .shell, .shell__sidebar, .shell__topbar, .shell__burger, .shell__scrim,
    .detail-bar, .wrap, .page-header, .pagination, .panel, .panel__body {
      display: none !important;
    }
    #detailOverlay {
      display: block !important; position: static !important; background: transparent !important;
      padding: 0 !important; margin: 0 !important; overflow: visible !important;
    }
    .sheet {
      box-shadow: none !important; margin: 0 !important; padding: 0 !important;
      width: 100% !important; max-width: none !important; border: 0 !important; background: transparent !important;
    }
    .entry, .profile-item { page-break-inside: avoid; }
    .rule { background: #0d6efd !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<script>
  fetch('/api/admin-me').then(function (r) {
    if (!r.ok) window.location.href = '/admin/';
  }).catch(function () { window.location.href = '/admin/'; });
</script>

  <div class="shell__topbar">
    <img class="shell__topbar-logo" src="/assets/img/logo-temu-karsa.png" alt="Temu Karsa">
  </div>
  <aside class="shell__sidebar">
    <div class="shell__brand">
      <img src="/assets/img/logo-temu-karsa.png" alt="Temu Karsa">
    </div>
    <nav class="shell__nav">
      <div class="shell__group-label">Main</div>
      <a class="shell__link" href="/admin/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <div class="shell__group-label">Konten</div>
      <a class="shell__link" href="/admin/articles/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Artikel
      </a>
      <div class="shell__group-label">KarsaBiz</div>
      <a class="shell__link" href="/admin/leads/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Legal Check
      </a>
      <a class="shell__link is-active" href="/admin/checklist/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>

      <a class="shell__logout" href="/api/admin-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Keluar
      </a>
    </div>
  </aside>

  <div class="shell__body">
    <div class="shell__main">
      <div class="page-header">
        <div>
          <h1 class="page-header__title">Checklist Dokumen Usaha</h1>
          <p class="page-header__sub">Semua yang submit Checklist Dokumen Usaha KarsaBiz — klik satu baris buat lihat detail &amp; download PDF</p>
        </div>
        <input type="search" id="listSearch" class="panel__search" placeholder="Cari nama atau email...">
      </div>
      <div class="wrap" id="listView">
        <section class="panel">
          <div class="table-scroll">
            <table id="listTable" class="cards-mobile" hidden>
              <colgroup>
                <col style="width:44px"><col style="width:16%"><col style="width:20%"><col style="width:15%"><col style="width:12%"><col style="width:17%"><col style="width:16%"><col style="width:48px">
              </colgroup>
              <thead>
                <tr><th class="col-check"><input type="checkbox" class="check" id="bulkAll" aria-label="Pilih semua baris di halaman ini"></th><th>Nama Pendiri</th><th>Email</th><th>No. WhatsApp</th><th>Tanggal</th><th>Jenis Layanan</th><th style="text-align:center">Status</th><th></th></tr>
              </thead>
              <tbody id="listBody"></tbody>
            </table>
          </div>
          <div class="skeleton" id="stateMsg">
            <div class="skeleton__row"></div><div class="skeleton__row"></div><div class="skeleton__row"></div>
          </div>
          <div class="pagination" id="pagination" hidden>

<div id="detailOverlay">
  <div class="detail-bar">
    <button class="btn btn--ghost" id="btnBack">&larr; Kembali ke daftar</button>
    <button class="btn" id="btnPrint">Download PDF</button>
  </div>
  <div class="sheet" id="sheetContent"></div>
</div>

<script src="../shell.js"></script>
<script src="../bulk.js"></script>
<script>
  var JENIS_LAYANAN_LABEL = {
    'pendirian-pt': 'Pendirian PT',
    'pendirian-cv': 'Pendirian CV',
    'nib-perizinan': 'NIB & Perizinan Berusaha',
    'legalitas-pertanahan': 'Legalitas Pertanahan',
  };
  function jenisLabel(v) { return JENIS_LAYANAN_LABEL[v] || v || '—'; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rupiah(v) {
    var n = Number(v || 0);
    return 'Rp' + n.toLocaleString('id-ID');
  }

  var DOTS_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 17.01"/></svg>';
  var ICON_UNDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';

  function actionsCell(items) {
    var buttons = items.map(function (it) {
      return '<button type="button" class="' + (it.danger ? 'is-danger' : '') + '" data-action="' + esc(it.action) + '" data-arg="' + esc(it.arg) + '">' + it.icon + esc(it.label) + '</button>';
    }).join('');
    return (
      '<td class="col-actions">' +
        '<div class="row-actions">' +
          '<button type="button" class="row-actions__btn" data-menu-toggle aria-label="Aksi baris">' + DOTS_ICON + '</button>' +
          '<div class="row-actions__menu">' + buttons + '</div>' +
        '</div>' +
      '</td>'
    );
  }

  document.addEventListener('click', function (e) {
    var toggle = e.target.closest('[data-menu-toggle]');
    var openMenu = document.querySelector('.row-actions.is-open');
    if (toggle) {
      e.stopPropagation();
      var wrap = toggle.closest('.row-actions');
      var wasOpen = wrap.classList.contains('is-open');
      if (openMenu) openMenu.classList.remove('is-open');
      if (!wasOpen) wrap.classList.add('is-open');
      return;
    }
    var actionBtn = e.target.closest('.row-actions__menu button[data-action]');
    if (actionBtn) {
      e.stopPropagation();
      if (openMenu) openMenu.classList.remove('is-open');
      runRowAction(actionBtn.dataset.action, actionBtn.dataset.arg);
      return;
    }
    if (openMenu && !e.target.closest('.row-actions__menu')) openMenu.classList.remove('is-open');
  });

  function runRowAction(action, arg) {
    if (action === 'view-pdf') {
      openDetail(arg);
    } else if (action === 'whatsapp') {
      window.open('https://wa.me/' + String(arg).replace(/\D/g, '').replace(/^0/, '62'), '_blank');
    } else if (action === 'mailto') {
      window.location.href = 'mailto:' + arg;
    } else if (action === 'delete') {
      if (!window.confirm('Hapus submission ini? Aksi ini gak bisa dibatalkan.')) return;
      fetch('/api/checklist-leads?id=' + encodeURIComponent(arg), { method: 'DELETE' })
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .then(function (res) { if (!res.ok) throw new Error(res.data.error || 'Gagal menghapus'); loadList(); })
        .catch(function (err) { window.alert(err.message); });
    } else if (action === 'mark-sent' || action === 'mark-unsent') {
      var newStatus = action === 'mark-sent' ? 'pdf_siap' : 'baru';
      fetch('/api/checklist-leads?id=' + encodeURIComponent(arg), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      })
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .then(function (res) { if (!res.ok) throw new Error(res.data.error || 'Gagal update status'); loadList(); })
        .catch(function (err) { window.alert(err.message); });
    }
  }

  var listBody = document.getElementById('listBody');
  var listTable = document.getElementById('listTable');
  var stateMsg = document.getElementById('stateMsg');
  var detailOverlay = document.getElementById('detailOverlay');
  var sheetContent = document.getElementById('sheetContent');

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function showState(kind, title, hint) {
    stateMsg.hidden = false;
    stateMsg.className = 'empty-state' + (kind === 'error' ? ' empty-state--error' : '');
    stateMsg.innerHTML = '<p class="empty-state__title">' + esc(title) + '</p><p class="empty-state__hint">' + esc(hint) + '</p>';
  }

  var allRows = [];
  var currentList = [];
  var currentPage = 1;
  var PAGE_SIZE = 10;
  var pagination = document.getElementById('pagination');
  var paginationInfo = document.getElementById('paginationInfo');
  var paginationNav = document.getElementById('paginationNav');
  Bulk.init({ body: listBody, table: listTable, endpoint: '/api/checklist-leads', noun: 'submission', onDone: loadList });

  function renderRows(rows, resetPage) {
    currentList = rows;
    if (resetPage) currentPage = 1;

    if (!rows.length) {
      listTable.hidden = true;
      pagination.hidden = true;
      Bulk.sync([]);
      var msg = allRows.length ? 'Tidak ada yang cocok' : 'Belum ada checklist masuk';
      var hint = allRows.length ? 'Coba kata kunci lain, atau kosongkan kolom pencarian.' : 'Submission muncul di sini otomatis begitu ada yang menyelesaikan Checklist Dokumen Usaha di website.';
      showState('empty', msg, hint);
      return;
    }
    stateMsg.hidden = true;
    listTable.hidden = false;

    var totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PAGE_SIZE;
    var pageItems = rows.slice(start, start + PAGE_SIZE);

    listBody.innerHTML = pageItems.map(function (row) {
      var statusClass = row.status === 'pdf_siap' ? 'status-pdf_siap' : 'status-baru';
      var statusText = row.status === 'pdf_siap' ? 'Sudah dikirim' : 'Belum diproses';
      return (
        '<tr class="is-clickable" data-id="' + esc(row.id) + '">' +
          Bulk.cell(esc(row.id)) +
          '<td class="cell-name cell-card-title">' + esc(row.nama) + '</td>' +
          '<td class="cell-muted" data-label="Email">' + esc(row.email) + '</td>' +
          '<td class="cell-muted cell-num" data-label="No. WhatsApp">' + esc(row.whatsapp) + '</td>' +
          '<td class="cell-muted" data-label="Tanggal">' + fmtDate(row.created_at) + '</td>' +
          '<td class="cell-muted" data-label="Jenis Layanan">' + esc(jenisLabel(row.jenisLayanan)) + '</td>' +
          '<td style="text-align:center" data-label="Status"><span class="status-chip ' + statusClass + '">' + esc(statusText) + '</span></td>' +
          actionsCell([
            { action: 'view-pdf', arg: row.id, label: 'Lihat & download PDF', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>' },
            { action: 'whatsapp', arg: row.whatsapp, label: 'Kirim via WhatsApp', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-4.95A9 9 0 1 1 8 19.5z"/></svg>' },
            { action: 'mailto', arg: row.email, label: 'Kirim via Email', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>' },
            row.status === 'pdf_siap'
              ? { action: 'mark-unsent', arg: row.id, label: 'Tandai Belum Diproses', icon: ICON_UNDO }
              : { action: 'mark-sent', arg: row.id, label: 'Tandai Sudah Dikirim', icon: ICON_CHECK },
            { action: 'delete', arg: row.id, label: 'Hapus', icon: ICON_TRASH, danger: true },
          ]) +
        '</tr>'
      );
    }).join('');
    Array.prototype.forEach.call(listBody.querySelectorAll('tr'), function (tr) {
      tr.addEventListener('click', function (e) {
        if (e.target.closest('.row-actions, .col-check')) return;
        openDetail(tr.dataset.id);
      });
    });

    Bulk.sync(rows.map(function (r) { return r.id; }));
    renderPagination(totalPages, rows.length, start, pageItems.length);
  }

  function renderPagination(totalPages, totalItems, start, shownCount) {
    if (totalPages <= 1) { pagination.hidden = true; return; }
    pagination.hidden = false;
    paginationInfo.textContent = 'Menampilkan ' + (start + 1) + '-' + (start + shownCount) + ' dari ' + totalItems + ' submission';

    var btns = [];
    btns.push('<button type="button" class="pagination__btn" data-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? ' disabled' : '') + ' aria-label="Halaman sebelumnya">&lsaquo;</button>');

    var pages = [];
    for (var p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) pages.push(p);
      else if (pages[pages.length - 1] !== '…') pages.push('…');
    }
    pages.forEach(function (p) {
      if (p === '…') { btns.push('<span class="pagination__ellipsis">…</span>'); return; }
      btns.push('<button type="button" class="pagination__btn' + (p === currentPage ? ' is-active' : '') + '" data-page="' + p + '">' + p + '</button>');
    });

    btns.push('<button type="button" class="pagination__btn" data-page="' + (currentPage + 1) + '"' + (currentPage === totalPages ? ' disabled' : '') + ' aria-label="Halaman berikutnya">&rsaquo;</button>');
    paginationNav.innerHTML = btns.join('');
  }
  paginationNav.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-page]');
    if (!btn || btn.disabled) return;
    currentPage = Number(btn.dataset.page);
    renderRows(currentList);
    document.querySelector('.panel').scrollIntoView({ block: 'start', behavior: 'smooth' });
  });

  document.getElementById('listSearch').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    var filtered = !q ? allRows : allRows.filter(function (l) {
      return (l.nama || '').toLowerCase().indexOf(q) !== -1 || (l.email || '').toLowerCase().indexOf(q) !== -1;
    });
    renderRows(filtered, true);
  });

  function loadList() {
    fetch('/api/checklist-leads').then(function (res) {
      if (res.status === 401) {
        window.location.href = '/admin/';
        return null;
      }
      return res.json();
    }).then(function (data) {
      if (!data) return;
      if (data.error) { showState('error', 'Data gagal dimuat', data.error); return; }
      allRows = data;
      renderRows(allRows);
    }).catch(function (err) { showState('error', 'Data gagal dimuat', String(err)); });
  }

  function renderPersons(persons) {
    if (!persons || !persons.length) return '';
    return (
      '<div class="section-label"><h2>Pendiri / Pemegang Saham</h2><span>' + persons.length + ' orang</span></div>' +
      persons.map(function (p, i) {
        return (
          '<div class="entry">' +
            '<p class="entry__title">' + (i + 1) + '. ' + esc(p.nama) + (p.saham ? ' — ' + esc(p.saham) + ' lembar saham' : '') + '</p>' +
            '<div class="profile-item"><dt>NIK</dt><dd>' + esc(p.nik) + '</dd></div>' +
            '<div class="profile-item"><dt>Alamat</dt><dd>' + esc(p.alamat) + '</dd></div>' +
          '</div>'
        );
      }).join('')
    );
  }

  function renderNpwp(npwpList) {
    if (!npwpList || !npwpList.length) return '';
    return (
      '<div class="section-label"><h2>NPWP Pribadi Pendiri</h2><span>' + npwpList.length + ' orang</span></div>' +
      npwpList.map(function (n, i) {
        return (
          '<div class="entry">' +
            '<div class="profile-item"><dt>' + (i + 1) + '. ' + esc(n.nama) + '</dt><dd>' + esc(n.npwp) + '</dd></div>' +
          '</div>'
        );
      }).join('')
    );
  }

  function renderCompanyNames(names) {
    if (!names || !names.length) return '';
    return (
      '<div class="section-label"><h2>Nama PT Pilihan</h2><span>' + names.length + ' opsi</span></div>' +
      names.map(function (n, i) {
        return '<div class="profile-item"><dt>Pilihan ' + (i + 1) + '</dt><dd>' + esc(n) + '</dd></div>';
      }).join('')
    );
  }

  function openDetail(id) {
    sheetContent.innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px 0">Memuat...</p>';
    detailOverlay.classList.add('is-open');
    fetch('/api/checklist-leads?id=' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (lead) {
      if (lead.error) { sheetContent.innerHTML = '<p>Gagal memuat: ' + esc(lead.error) + '</p>'; return; }
      var answers = lead.answers || {};
      var ref = 'CDU-' + new Date(lead.created_at).getFullYear() + '-' + lead.id.slice(0, 6).toUpperCase();
      sheetContent.innerHTML =
        '<div class="letterhead">' +
          '<div class="letterhead__brand">' +
            '<img src="/assets/img/logo-temu-karsa.png" alt="Temu Karsa">' +
            '<p class="letterhead__addr">Ruko Taman Juanda, Jl. Pahlawan Blok B1 No.3,<br>Bekasi Timur, Jawa Barat 17111<br>temukarsaid@gmail.com &middot; +62 851-2155-8129</p>' +
          '</div>' +
          '<div class="letterhead__meta">' +
            '<h1 class="letterhead__doctitle">Checklist Dokumen Usaha</h1>' +
            '<p class="letterhead__row">No. Referensi: ' + esc(ref) + '</p>' +
            '<p class="letterhead__row">Tanggal: ' + fmtDate(lead.created_at) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="rule"></div>' +
        '<div class="meta-grid">' +
          '<div>' +
            '<p class="meta-label">Jenis Layanan</p>' +
            '<p class="meta-value">' + esc(jenisLabel(answers.jenisLayanan)) + '</p>' +
          '</div>' +
          '<div>' +
            '<p class="meta-label">Kontak Aktif</p>' +
            '<div class="profile-item"><dt>WhatsApp</dt><dd>' + esc(lead.whatsapp) + '</dd></div>' +
            '<div class="profile-item"><dt>Email</dt><dd>' + esc(lead.email) + '</dd></div>' +
          '</div>' +
        '</div>' +
        renderPersons(answers.persons) +
        renderNpwp(answers.npwpList) +
        renderCompanyNames(answers.companyNames) +
        '<div class="section-label"><h2>Alamat Kedudukan Usaha</h2></div>' +
        '<p class="body-text">' + esc(answers.businessAddress) + '</p>' +
        '<div class="section-label"><h2>Modal & Saham</h2></div>' +
        '<div class="profile-item"><dt>Modal Dasar</dt><dd>' + rupiah(answers.modalDasar) + '</dd></div>' +
        '<div class="profile-item"><dt>Modal Disetor</dt><dd>' + rupiah(answers.modalDisetor) + '</dd></div>' +
        '<p class="disclaimer"><strong>Catatan:</strong> Dokumen ini adalah rangkuman isian Checklist Dokumen Usaha dari KarsaBiz, bukan dokumen legalitas resmi — tim Temu Karsa akan menghubungi untuk proses lanjutan.</p>';
    }).catch(function (err) { sheetContent.innerHTML = '<p>Gagal memuat: ' + err + '</p>'; });
  }

  document.getElementById('btnBack').addEventListener('click', function () {
    detailOverlay.classList.remove('is-open');
  });
  document.getElementById('btnPrint').addEventListener('click', function () { window.print(); });

  loadList();

  var linkedId = new URLSearchParams(window.location.search).get('id');
  if (linkedId) openDetail(linkedId);
</script>
</body>
</html>
