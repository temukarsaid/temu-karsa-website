<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Artikel | Temu Karsa Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/assets/img/favicon-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shell.css">
<style>
  .article-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn-add {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
    border-radius: 999px; border: 0; background: var(--blue); color: #fff;
    font-family: var(--font); font-weight: 700; font-size: .88rem; cursor: pointer;
    text-decoration: none; white-space: nowrap; transition: background-color .15s;
  }
  .btn-add:hover { background: var(--navy); }
  .btn-add svg { width: 16px; height: 16px; flex-shrink: 0; }

  @media (max-width: 900px) {
    /* Di tablet: tombol "+ Artikel" sejajar sama judul (baris atas, rata
       kanan) — bukan ikut turun nempel di bawah search. Search-nya sendiri
       yang turun ke baris sendiri, full width, di bawah judul+tombol.
       display:contents ngilangin .article-toolbar dari box model (dianggap
       gak ada), jadi anak-anaknya (search & tombol) jadi flex item LANGSUNG
       punya .page-header — baru bisa diatur urutannya masing-masing lewat
       "order" independen dari judul. */
    .article-toolbar { display: contents; }
    .page-header > div:first-child { order: 1; }
    .btn-add { order: 2; justify-content: center; }
    .article-toolbar #articleListSearch { order: 3; width: 100%; }
  }
  @media (max-width: 520px) {
    .btn-add { width: 100%; }
  }

  .pagination {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 16px 4px 4px; border-top: 1px solid var(--line);
  }
  .pagination__info { font-size: .82rem; color: var(--muted); }
  .pagination__nav { display: flex; align-items: center; gap: 4px; }
  .pagination__btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; border: 0;
    background: transparent; color: var(--ink); font-family: var(--font);
    font-size: .84rem; font-weight: 600; cursor: pointer;
  }
  .pagination__btn:hover { background: var(--canvas-alt); }
  .pagination__btn.is-active { background: var(--blue); color: #fff; }
  .pagination__btn:disabled { color: var(--line); cursor: default; }
  .pagination__btn:disabled:hover { background: transparent; }
  .pagination__ellipsis { padding: 0 4px; color: var(--muted); font-size: .84rem; }
</style>
</head>
<body>

<div class="shell">
<div class="shell__topbar">
  <img class="shell__topbar-logo" src="/assets/img/logo-temu-karsa.png" alt="Temu Karsa">
</div>
<aside class="shell__sidebar">
  <div class="shell__brand">
    <img src="/assets/img/logo-temu-karsa.png" alt="Temu Karsa">
  </div>
  <nav class="shell__nav">
    <div class="shell__group-label">Main</div>
    <a class="shell__link" href="/admin/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <div class="shell__group-label">Konten</div>
    <a class="shell__link is-active" href="/admin/articles/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Artikel
    </a>
    <div class="shell__group-label">KarsaBiz</div>
    <a class="shell__link" href="/admin/leads/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Leads
    </a>
  </nav>
  <div class="shell__sidebar-foot">
    <a class="shell__logout" href="/api/admin-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Keluar
    </a>
  </div>
</aside>

<div class="shell__body">
<div class="shell__main">
  <div class="page-header">
    <div>
      <h1 class="page-header__title">Artikel</h1>
      <p class="page-header__sub">Semua artikel yang tayang di website Temu Karsa</p>
    </div>
    <div class="article-toolbar">
      <input type="search" id="articleListSearch" class="panel__search" placeholder="Cari judul artikel...">
      <a class="btn-add" href="edit.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Artikel
      </a>
    </div>
  </div>
  <section class="panel">
    <div class="table-scroll">
      <table id="articleListTable" class="cards-mobile" hidden>
        <colgroup>
          <col style="width:44px"><col style="width:100px"><col style="width:47%">
          <col style="width:14%"><col style="width:13%"><col style="width:13%">
          <col style="width:13%"><col style="width:48px">
        </colgroup>
        <thead>
          <tr>
            <th>No</th><th>Thumbnail</th><th>Judul</th><th>Kategori</th>
            <th>Waktu Baca</th><th>Tanggal</th><th style="text-align:center">Status</th><th></th>
          </tr>
        </thead>
        <tbody id="articleListBody"></tbody>
      </table>
    </div>
    <div class="skeleton" id="articleListState">
      <div class="skeleton__row"></div><div class="skeleton__row"></div><div class="skeleton__row"></div>
    </div>
    <div class="pagination" id="pagination" hidden>
      <span class="pagination__info" id="paginationInfo"></span>
      <div class="pagination__nav" id="paginationNav"></div>
    </div>
  </section>
</div>
</div>
</div>

<script src="../shell.js"></script>
<script>
  // Gerbang login dashboard (email+password).
  fetch('/api/admin-me').then(function (r) {
    if (!r.ok) window.location.href = '/admin/';
  }).catch(function () { window.location.href = '/admin/'; });
</script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var DOTS_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';
  function actionsCell(items) {
    var buttons = items.map(function (it) {
      return '<button type="button" data-action="' + esc(it.action) + '" data-arg="' + esc(it.arg) + '">' + it.icon + esc(it.label) + '</button>';
    }).join('');
    return (
      '<td class="col-actions">' +
        '<div class="row-actions">' +
          '<button type="button" class="row-actions__btn" data-menu-toggle aria-label="Aksi baris">' + DOTS_ICON + '</button>' +
          '<div class="row-actions__menu">' + buttons + '</div>' +
        '</div>' +
      '</td>'
    );
  }
  document.addEventListener('click', function (e) {
    var toggle = e.target.closest('[data-menu-toggle]');
    var openMenu = document.querySelector('.row-actions.is-open');
    if (toggle) {
      var wrap = toggle.closest('.row-actions');
      var wasOpen = wrap.classList.contains('is-open');
      if (openMenu) openMenu.classList.remove('is-open');
      if (!wasOpen) wrap.classList.add('is-open');
      return;
    }
    var actionBtn = e.target.closest('.row-actions__menu button[data-action]');
    if (actionBtn) {
      if (openMenu) openMenu.classList.remove('is-open');
      runArticleAction(actionBtn.dataset.action, actionBtn.dataset.arg);
      return;
    }
    if (openMenu && !e.target.closest('.row-actions__menu')) openMenu.classList.remove('is-open');
  });
  function runArticleAction(action, arg) {
    if (action === 'edit') {
      window.location.href = 'edit.html?slug=' + encodeURIComponent(arg);
    } else if (action === 'view-live') {
      window.open('/' + arg + '.html', '_blank');
    } else if (action === 'copy-link') {
      if (navigator.clipboard) navigator.clipboard.writeText(window.location.origin + '/' + arg + '.html').catch(function () {});
    }
  }

  // Daftar artikel ditarik dari admin/dev-save-server.js (baca langsung dari
  // disk, http://localhost:8082/articles) — otomatis ke-update begitu ada
  // artikel baru/dihapus lewat form edit.html, gak perlu daftar slug manual
  // lagi. Kalau save-server-nya belum jalan (mis. lupa `npm run admin:save`),
  // jatuh ke daftar slug manual sebagai fallback biar halaman ini tetap bisa
  // dipakai buat LIHAT artikel yang sudah ada (cuma gak update real-time).
  var FALLBACK_SLUGS = [
    'pembuatan-cv',
    'pt-perorangan-pmdn-pma',
    'kbli-2025',
    'kbli-2025-explained',
    'rekomendasi-meeting-room-bekasi',
  ];

  var allArticles = [];
  var currentList = []; // list yg lagi ditampilin (udah kefilter search)
  var currentPage = 1;
  var PAGE_SIZE = 10; // ~7-9 baris muat 1 layar tanpa scroll di laptop biasa,
                       // 10 dipilih biar angkanya bulat & gampang diinget —
                       // sisa dikit ke-scroll di layar kecil itu wajar.

  // dateDisplay itu field opsional (dihitung otomatis pas build Eleventy,
  // lihat eleventy/_data/articles.js) — artikel yang baru disave lewat
  // edit.html belum ngelewatin build itu, jadi field-nya bisa kosong.
  // Fallback format di sini biar kolom Tanggal tetap kebaca sebelum build.
  function fmtDateDisplay(a) {
    if (a.dateDisplay) return a.dateDisplay;
    if (!a.date) return '';
    var d = new Date(a.date);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function renderArticleRows(list, resetPage) {
    currentList = list;
    if (resetPage) currentPage = 1;

    var table = document.getElementById('articleListTable');
    var body = document.getElementById('articleListBody');
    var state = document.getElementById('articleListState');
    var pagination = document.getElementById('pagination');

    if (!list.length) {
      table.hidden = true;
      pagination.hidden = true;
      state.hidden = false;
      state.className = 'empty-state';
      var msg = allArticles.length ? 'Gak ada artikel yang cocok' : 'Belum ada artikel';
      state.innerHTML = '<p class="empty-state__title">' + esc(msg) + '</p>';
      return;
    }
    state.hidden = true;
    table.hidden = false;

    var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PAGE_SIZE;
    var pageItems = list.slice(start, start + PAGE_SIZE);

    body.innerHTML = pageItems.map(function (a, i) {
      var thumb = a.heroImage ? '<img class="article-thumb" src="/' + esc(a.heroImage) + '" alt="">' : '<div class="article-thumb"></div>';
      var isDraft = a.draft === true;
      var statusChip = '<span class="status-chip ' + (isDraft ? 'status-baru' : 'status-pdf_siap') + '">' + (isDraft ? 'Draft' : 'Publish') + '</span>';
      return (
        '<tr>' +
          '<td class="cell-muted cell-card-no">' + (start + i + 1) + '</td>' +
          '<td class="cell-card-media" style="text-align:center">' + thumb + '</td>' +
          '<td class="cell-name cell-card-title">' + esc(a.title) + '</td>' +
          '<td class="cell-muted" data-label="Kategori">' + esc(a.category) + '</td>' +
          '<td class="cell-muted" data-label="Waktu Baca">' + esc(a.readTime) + '</td>' +
          '<td class="cell-muted" data-label="Tanggal">' + esc(fmtDateDisplay(a)) + '</td>' +
          '<td style="text-align:center" data-label="Status">' + statusChip + '</td>' +
          actionsCell([
            { action: 'edit', arg: a.slug, label: 'Edit artikel', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>' },
            { action: 'view-live', arg: a.slug, label: 'Lihat di situs', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>' },
            { action: 'copy-link', arg: a.slug, label: 'Salin link', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' },
          ]) +
        '</tr>'
      );
    }).join('');

    renderPagination(totalPages, list.length, start, pageItems.length);
  }

  function renderPagination(totalPages, totalItems, start, shownCount) {
    var pagination = document.getElementById('pagination');
    var info = document.getElementById('paginationInfo');
    var nav = document.getElementById('paginationNav');

    if (totalPages <= 1) { pagination.hidden = true; return; }
    pagination.hidden = false;
    info.textContent = 'Menampilkan ' + (start + 1) + '-' + (start + shownCount) + ' dari ' + totalItems + ' artikel';

    var btns = [];
    btns.push('<button type="button" class="pagination__btn" data-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? ' disabled' : '') + ' aria-label="Halaman sebelumnya">&lsaquo;</button>');

    var pages = [];
    for (var p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) pages.push(p);
      else if (pages[pages.length - 1] !== '…') pages.push('…');
    }
    pages.forEach(function (p) {
      if (p === '…') { btns.push('<span class="pagination__ellipsis">…</span>'); return; }
      btns.push('<button type="button" class="pagination__btn' + (p === currentPage ? ' is-active' : '') + '" data-page="' + p + '">' + p + '</button>');
    });

    btns.push('<button type="button" class="pagination__btn" data-page="' + (currentPage + 1) + '"' + (currentPage === totalPages ? ' disabled' : '') + ' aria-label="Halaman berikutnya">&rsaquo;</button>');
    nav.innerHTML = btns.join('');
  }
  document.getElementById('paginationNav').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-page]');
    if (!btn || btn.disabled) return;
    currentPage = Number(btn.dataset.page);
    renderArticleRows(currentList);
    document.querySelector('.panel').scrollIntoView({ block: 'start', behavior: 'smooth' });
  });

  document.getElementById('articleListSearch').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    var filtered = !q ? allArticles : allArticles.filter(function (a) {
      return (a.title || '').toLowerCase().indexOf(q) !== -1;
    });
    renderArticleRows(filtered, true);
  });

  function sortByDateDesc(list) {
    return list.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
  }

  function loadFallback() {
    Promise.all(FALLBACK_SLUGS.map(function (slug) {
      return fetch('/eleventy/articles/' + slug + '.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    })).then(function (articles) {
      allArticles = sortByDateDesc(articles.filter(Boolean));
      renderArticleRows(allArticles);
    }).catch(function () {
      var state = document.getElementById('articleListState');
      state.hidden = false;
      state.className = 'empty-state empty-state--error';
      state.innerHTML = '<p class="empty-state__title">Artikel gagal dimuat</p><p class="empty-state__hint">Coba refresh halaman ini.</p>';
    });
  }

  function loadArticleList() {
    fetch('http://localhost:8082/articles').then(function (r) {
      if (!r.ok) throw new Error('save-server error');
      return r.json();
    }).then(function (data) {
      allArticles = sortByDateDesc(data.articles || []);
      renderArticleRows(allArticles);
    }).catch(loadFallback);
  }
  loadArticleList();
})();
</script>
</body>
</html>
